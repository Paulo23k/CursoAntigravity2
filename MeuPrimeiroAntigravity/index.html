<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dia - Produtividade Diária</title>
    <!-- Favicon SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>">
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Folha de Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Decorativo Sutil -->
    <div class="bg-gradient-sphere sphere-1"></div>
    <div class="bg-gradient-sphere sphere-2"></div>

    <main class="app-card">
        <!-- Barra Superior: Data e Seletor de Tema (Dark / Light) -->
        <div class="top-bar">
            <div class="date-badge" id="data-atual">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span id="data-texto">Hoje</span>
            </div>

            <!-- Botão Alternador de Tema -->
            <button type="button" id="btn-tema" class="btn-tema" aria-label="Alternar entre modo claro e escuro" title="Alternar tema">
                <!-- Ícone Sol (Modo Claro) -->
                <svg class="icone-sol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <!-- Ícone Lua (Modo Escuro) -->
                <svg class="icone-lua" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>

        <!-- Cabeçalho -->
        <header class="app-header">
            <!-- Título Centralizado -->
            <h1 class="app-title">Meu Dia</h1>
            <p class="app-subtitle">Foco, clareza e produtividade para a sua rotina</p>

            <!-- Painel de Progresso Interativo -->
            <div class="progresso-container" id="progresso-wrapper">
                <div class="progresso-info">
                    <span class="progresso-rotulo">Progresso de Hoje</span>
                    <span class="progresso-contador" id="progresso-texto">0 de 0 concluídas</span>
                </div>
                <div class="progresso-barra-fundo">
                    <div class="progresso-barra-preenchimento" id="progresso-barra" style="width: 0%;"></div>
                </div>
            </div>
        </header>

        <!-- Formulário de Entrada -->
        <form id="form-tarefa" class="tarefa-form" novalidate>
            <div class="input-wrapper">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <input 
                    type="text" 
                    id="input-tarefa" 
                    class="tarefa-input" 
                    placeholder="Adicionar uma tarefa para hoje..." 
                    autocomplete="off"
                    aria-label="Descrição da nova tarefa"
                >
            </div>
            <button type="submit" id="btn-adicionar" class="btn-adicionar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Adicionar</span>
            </button>
        </form>

        <!-- Filtros Interativos -->
        <nav class="filtros-container" aria-label="Filtrar tarefas">
            <button type="button" class="filtro-btn ativo" data-filtro="todas">
                Todas <span class="badge" id="badge-todas">0</span>
            </button>
            <button type="button" class="filtro-btn" data-filtro="pendentes">
                Pendentes <span class="badge" id="badge-pendentes">0</span>
            </button>
            <button type="button" class="filtro-btn" data-filtro="concluidas">
                Concluídas <span class="badge" id="badge-concluidas">0</span>
            </button>
        </nav>

        <!-- Lista de Tarefas -->
        <section class="tarefas-secao">
            <ul id="lista-tarefas" class="lista-tarefas" aria-live="polite">
                <!-- Inserido dinamicamente via JavaScript -->
            </ul>

            <!-- Estado Vazio -->
            <div id="mensagem-vazia" class="mensagem-vazia">
                <div class="empty-icon-wrap">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
                    </svg>
                </div>
                <h3 class="empty-title">Tudo limpo por aqui!</h3>
                <p class="empty-desc">Nenhuma tarefa encontrada. Aproveite seu dia ou comece adicionando suas metas acima.</p>
            </div>
        </section>

        <!-- Rodapé do Card com Ações Rápidas -->
        <footer class="app-footer">
            <span class="dica-atalho">Dica: pressione <kbd>Enter</kbd> para adicionar</span>
            <button type="button" id="btn-limpar-concluidas" class="btn-link" title="Remover tarefas concluídas">
                Limpar concluídas
            </button>
        </footer>
    </main>

    <!-- Notificações Toast Modernas -->
    <div id="toast-container" class="toast-container" aria-live="assertive"></div>

    <!-- Canvas para efeito de celebração ao zerar tarefas -->
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

    <!-- Lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
